    function autoTagTextFields(container){
      var skipTags = {SCRIPT:1, STYLE:1, NOSCRIPT:1, SVG:1, PATH:1};
      var counter = 1;

      // Collect every meaningful text node first (walking live would break as we wrap).
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node){
          if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          var p = node.parentNode;
          while(p && p !== container){
            if(skipTags[p.tagName]) return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var textNodes = [];
      var n;
      while((n = walker.nextNode())) textNodes.push(n);

      textNodes.forEach(function(node){
        var parent = node.parentNode;
        // If this text node is the parent's ONLY content, tag the parent directly —
        // keeps the original element and its styling intact.
        var parentIsSoleOwner = parent.childNodes.length === 1 && parent !== container;
        if(parentIsSoleOwner){
          if(parent.hasAttribute('data-field')) return;
          parent.setAttribute('data-field', 'autoText' + counter++);
        } else {
          // Mixed content (text sitting next to child elements) — wrap just this
          // text in a span so it becomes independently editable.
          var span = document.createElement('span');
          span.setAttribute('data-field', 'autoText' + counter++);
          span.textContent = node.nodeValue;
          parent.replaceChild(span, node);
        }
      });
    }

    function extractPageMarkup(raw){
      // If someone pastes a whole page's source (doctype/html/head/body, scripts,
      // wp-emoji-loader.js and all), pull out just the useful bits: any <style>
      // rules plus the body markup, with <script> tags stripped since they never
      // execute when injected via innerHTML anyway.
      if(!/<html[\s>]|<body[\s>]/i.test(raw)) return raw;
      try{
        var doc = new DOMParser().parseFromString(raw, 'text/html');
        if(!doc.body) return raw;
        // Dedupe by content: some sources repeat the exact same <style> block
        // twice (e.g. once in <head>, once elsewhere) — keep only the first.
        var seenStyles = {};
        var uniqueStyles = [];
        Array.prototype.forEach.call(doc.querySelectorAll('style'), function(st){
          var key = st.textContent.replace(/\s+/g, ' ').trim();
          if(seenStyles[key]) return;
          seenStyles[key] = true;
          uniqueStyles.push(st.outerHTML);
        });
        var styles = uniqueStyles.join('\n');
        Array.prototype.forEach.call(doc.body.querySelectorAll('script, noscript'), function(sc){ sc.remove(); });
        return (styles ? styles + '\n' : '') + doc.body.innerHTML.trim();
      } catch(e){
        return raw;
      }
    }

    function sanitizeTrackingConflicts(container){
      // Whatever gets pasted here in future — strip any tracking it brought
      // with it, so OUR pixel/dedup/currency setup is always the only thing
      // firing. Prevents duplicate or foreign Lead/Subscribe/PageView events.
      var removedOnclicks = 0, removedPixelImgs = 0, removedScripts = 0;
      Array.prototype.forEach.call(container.querySelectorAll('[onclick]'), function(el){
        var oc = el.getAttribute('onclick') || '';
        if(/fbq\s*\(/.test(oc)){
          el.removeAttribute('onclick');
          removedOnclicks++;
        }
      });
      Array.prototype.forEach.call(container.querySelectorAll('img[src*="facebook.com/tr"]'), function(img){
        img.remove();
        removedPixelImgs++;
      });
      Array.prototype.forEach.call(container.querySelectorAll('script'), function(sc){
        // Inert anyway once inserted via innerHTML, but keep the source clean.
        sc.remove();
        removedScripts++;
      });
      return { removedOnclicks: removedOnclicks, removedPixelImgs: removedPixelImgs, removedScripts: removedScripts };
    }

        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, messages: [{ role: "user", content: prompt }] })
      });
      var data = await response.json();
      var textBlock = (data.content || []).find(function(b){ return b.type === 'text'; });
      return textBlock ? textBlock.text.trim() : '';
    }

    async function translateField(fieldId, mode){
      var textarea = document.getElementById('ta_'+fieldId);
      var statusEl = document.getElementById('status_'+fieldId);
      statusEl.textContent = 'Translating…';
      statusEl.className = 'field-status';
      try{
        var src = textarea.value;
        var instruction = mode === 'ta'
          ? 'Translate this short marketing/UI line into natural Tamil (Tamil script). Keep brand names, numbers, emoji and links unchanged. Return ONLY the translated line, nothing else:\n\n"' + src + '"'
          : 'Rewrite this short marketing/UI line into casual Tanglish (Tamil words spelled in Roman script, mixed naturally with English as commonly used in Tamil Nadu social media ads). Keep brand names, numbers, emoji and links unchanged. Return ONLY the result, nothing else:\n\n"' + src + '"';
        var result = await callClaude(instruction);
        textarea.value = result;
        applyField(fieldId);
        statusEl.textContent = 'Translated & applied.';
        statusEl.className = 'field-status ok';
      }catch(e){
        statusEl.textContent = 'Failed: ' + e.message;
        statusEl.className = 'field-status err';
      }
    }

    function generateFinalCode(){
      document.body.setAttribute('data-redirect-enabled', document.getElementById('enableRedirectCheckbox').checked ? 'true' : 'false');

      var clone = document.documentElement.cloneNode(true);
      clone.removeAttribute('id');
      if(clone.querySelector('body')) clone.querySelector('body').removeAttribute('id');
      var toggle = clone.querySelector('#editToggle');
      var panel = clone.querySelector('#editPanel');
      if(toggle) toggle.remove();
      if(panel) panel.remove();

      var html = '<!DOCTYPE html>\n' + clone.outerHTML;

      var section = document.getElementById('finalCodeSection');
      var output = document.getElementById('finalCodeOutput');
      output.value = html;
      section.style.display = 'block';
      output.focus();
      output.select();
      section.scrollIntoView({behavior:'smooth', block:'nearest'});

      var logoImgFinal = document.getElementById('logoImg');
      var logoSrc = logoImgFinal ? (logoImgFinal.getAttribute('src') || '') : '';
      var s = document.getElementById('status_finalcode');
      var notes = [];
      if(logoSrc.indexOf('data:') === 0){
        var approxKB = Math.round(logoSrc.length * 0.75 / 1024);
        notes.push('✓ Image embedded (~' + approxKB + ' KB)');
      } else {
        notes.push('⚠ No image uploaded — logo will be blank');
      }
      if(CONFIG.pixelId){
        notes.push('✓ Pixel ID set — Lead & Subscribe events will fire on click');
      } else {
        notes.push('⚠ No Pixel ID set — tracking will stay silent until you add one');
      }
      s.textContent = notes.join('. ') + '. Total code: ' + html.length.toLocaleString() + ' characters. Tap Copy.';
      s.className = (logoSrc.indexOf('data:') === 0 && CONFIG.pixelId) ? 'field-status ok' : 'field-status err';
    }

    function copyFinalCode(){
      var output = document.getElementById('finalCodeOutput');
      var s = document.getElementById('status_finalcode');
      output.focus();
      output.select();
      try{
        navigator.clipboard.writeText(output.value).then(function(){
          s.textContent = 'Copied to clipboard.';
          s.className = 'field-status ok';
        }).catch(function(){
          fallbackCopy(s);
        });
      }catch(e){
        fallbackCopy(s);
      }
    }

    function fallbackCopy(s){
      try{
        document.execCommand('copy');
        s.textContent = 'Copied to clipboard.';
        s.className = 'field-status ok';
      }catch(e){
        s.textContent = 'Auto-copy blocked here — box is selected, just press Copy manually.';
        s.className = 'field-status err';
      }
    }

    window.applyTelegramLink = applyTelegramLink;
    window.applyPixelId = applyPixelId;
    window.applyEventValue = applyEventValue;
    window.applyField = applyField;
    window.clearField = clearField;
    window.translateField = translateField;
    window.applyCustomHTML = applyCustomHTML;
    window.clearCustomHTML = clearCustomHTML;
    window.redesignFromScreenshot = redesignFromScreenshot;
    window.applyButtonLink = applyButtonLink;
    window.useTelegramForButton = useTelegramForButton;
    window.generateFinalCode = generateFinalCode;
    window.copyFinalCode = copyFinalCode;

    buildButtonPanel();
    buildFieldPanel();
  }
</script>



</body></html>
